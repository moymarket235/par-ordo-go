name: Build PAR ORDO GO APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/par-ordo-go.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: par-ordo-go-apk
          path: dist/par-ordo-go.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: par-ordo-go-apk-${{ github.run_number }}
          name: PAR ORDO GO APK · Build ${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          body: |
            PAR ORDO GO Android WebView APK.

            Бул биринчи CI чыгарылышы debug signing key менен түзүлөт. Google Play же туруктуу жаңыртуулар үчүн жеке release keystore колдонуу керек.
          files: dist/par-ordo-go.apk

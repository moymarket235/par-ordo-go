<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ПАР ОРДО GO</title>
<meta name="theme-color" content="#0b1711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ПАР ОРДО GO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/par-ordo-logo.png">
<style>
:root{--bg:#0b1711;--deep:#12281c;--gold:#e2b45c;--ember:#ff8a3d;--mist:#cfe3d4;--ink:#f3efe3;--line:rgba(226,180,92,.22)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 0;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* intro */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(60% 50% at 50% 55%,#173824,var(--bg));transition:opacity .9s,transform .9s}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#mark{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;object-fit:cover;opacity:0;transform:scale(.6);transition:opacity 1s,transform 1.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(226,180,92,.55)}
#intro.show #mark{opacity:1;transform:scale(1)}
#word{position:absolute;left:0;right:0;top:calc(50% + 100px);text-align:center;font:600 26px Georgia,"Iowan Old Style",serif;letter-spacing:.14em;opacity:0;transition:opacity 1s .4s}
#intro.show #word{opacity:1}
#skip{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);color:var(--mist);opacity:.7;padding:8px 12px}

/* app */
main{max-width:480px;margin:0 auto;padding:22px 18px calc(96px + env(safe-area-inset-bottom))}
h1{font:600 30px/1.15 Georgia,"Iowan Old Style",serif;margin:6px 0 4px}
.sub{color:var(--mist);opacity:.8;font-size:15px}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#qrbtn{display:block;width:100%;margin:22px 0 14px;padding:26px 20px;text-align:left;border-radius:26px;background:linear-gradient(135deg,#f0c56d,var(--ember));color:#1a1206;box-shadow:0 18px 50px -18px rgba(255,138,61,.7)}
#qrbtn b{display:block;font:700 24px Georgia,serif}
#qrbtn span{font-size:14px;opacity:.8}
.card{padding:18px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px}
.dots{display:flex;gap:10px;align-items:center}
.dot{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.12)}
.dot.on{background:linear-gradient(90deg,var(--gold),var(--ember))}
.dot.gift{flex:0 0 46px;height:34px;border-radius:12px;display:grid;place-items:center;border:1px dashed var(--gold);font-size:12px;color:var(--gold)}
.note{margin-top:10px;font-size:14px;color:var(--mist);opacity:.85}
.visit{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid rgba(255,255,255,.07)}
.visit:first-of-type{border-top:0}
.visit small{display:block;color:var(--mist);opacity:.7;margin-top:3px;font-size:13px}
.sum{font-weight:700;color:var(--gold);white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.total b{font:700 22px Georgia,serif;color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
nav button{padding:12px 22px;border-radius:16px;color:var(--mist)}
nav button[aria-selected=true]{background:var(--deep);color:var(--gold);border:1px solid var(--line)}
section[hidden]{display:none}

/* qr modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,12,8,.78);display:none;place-items:center;padding:20px}
#modal.open{display:grid}
.sheet{width:100%;max-width:340px;padding:26px 22px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
#qr{background:#fff;padding:14px;border-radius:18px;display:inline-block;margin:14px 0 8px}
#qr img,#qr canvas{display:block}
.timer{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 6px 12px}
.timer i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.close{margin-top:10px;padding:12px 26px;border-radius:14px;border:1px solid var(--line);color:var(--mist)}
.demo{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);font-size:11px;color:var(--mist);opacity:.45;z-index:5}
@media (prefers-reduced-motion:reduce){#intro,#mark,#word{transition:none}.sheet{animation:none}}
</style>
</head>
<body>
<div id="intro" role="presentation">
  <canvas id="c"></canvas>
  <img id="mark" src="assets/par-ordo-logo.png" alt="ПАР ОРДО" onerror="this.style.display='none'">
  <div id="word">ПАР ОРДО GO</div>
  <button id="skip">Пропустить</button>
</div>

<div class="demo">демо-данные</div>
<main>
  <section id="home">
    <p class="sub">Добро пожаловать</p>
    <h1 id="hello">Айбек Н.</h1>
    <button id="qrbtn"><b>Показать QR</b><span>Покажите администратору при входе</span></button>

    <div class="card glass">
      <h2>Бонус: 5-й вход бесплатно</h2>
      <div class="dots" id="dots"></div>
      <p class="note" id="bnote"></p>
    </div>

    <div class="card glass">
      <h2>Последние посещения</h2>
      <div id="last"></div>
    </div>
  </section>

  <section id="visits" hidden>
    <h1>Посещения</h1>
    <p class="sub">Браслет, покупки и сумма за каждый визит</p>
    <div class="card glass" style="margin-top:18px">
      <div id="all"></div>
      <div class="total"><span class="sub">Потрачено всего</span><b id="tot"></b></div>
    </div>
  </section>
</main>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="home">Главная</button>
  <button role="tab" aria-selected="false" data-t="visits">Посещения</button>
</nav>

<div id="modal" role="dialog" aria-modal="true" aria-label="QR для входа">
  <div class="sheet glass">
    <h2 style="font:600 20px Georgia,serif">Ваш QR-код</h2>
    <div id="qr"></div>
    <div class="timer"><i id="bar"></i></div>
    <p class="note" id="qnote">Обновится через 60 с</p>
    <button class="close" id="close">Закрыть</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== DEMO DATA: заменить на ответы API (Cloudflare Worker) ===== */
const ME={id:'demo-customer',name:'Айбек Н.'};
const BONUS={active:true,count:3,need:4};
const VISITS=[
 {date:'08.11.2026',bracelet:14,items:'Чай, веник, полотенце',sum:1350},
 {date:'01.11.2026',bracelet:7,items:'Шоро, вода',sum:900},
 {date:'25.10.2026',bracelet:22,items:'Чай с лимоном',sum:650}
];
const $=s=>document.querySelector(s), money=n=>n.toLocaleString('ru-RU')+' сом';

/* ===== intro ===== */
(function(){
  const intro=$('#intro');
  let done=false;
  const end=()=>{if(done)return;done=true;intro.classList.add('out');setTimeout(()=>intro.remove(),1000)};
  let seen=false;try{seen=sessionStorage.getItem('po_go_intro')==='1'}catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion:reduce)').matches){intro.remove();return}
  try{sessionStorage.setItem('po_go_intro','1')}catch(e){}
  $('#skip').onclick=end;
  const cv=$('#c'),g=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  let W,H;const fit=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)};fit();
  const N=150,R=78,P=[];
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2;P.push({sx:Math.random()*W,sy:H+Math.random()*160,a,d:Math.random()*.9,s:1+Math.random()*2.2,w:Math.random()*6})}
  const ease=p=>1-Math.pow(1-p,3),t0=performance.now();
  (function frame(now){
    if(done)return;const t=(now-t0)/1000;
    g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
    const cx=W/2,cy=H/2;
    for(const p of P){
      const k=ease(Math.min(1,Math.max(0,(t-p.d)/1.7)));
      let tx=cx+Math.cos(p.a)*R,ty=cy+Math.sin(p.a)*R,al=.9;
      if(t>2.1){const b=Math.min(1,(t-2.1)/1.2);tx=cx+Math.cos(p.a)*(R+b*Math.max(W,H)*.35);ty=cy+Math.sin(p.a)*(R+b*Math.max(W,H)*.35);al=.9*(1-b)}
      const x=p.sx+(tx-p.sx)*k+Math.sin(t*2+p.w)*(1-k)*18,y=p.sy+(ty-p.sy)*k;
      g.fillStyle=`rgba(${p.s>2?255:226},${p.s>2?138:180},${p.s>2?61:92},${al})`;
      g.beginPath();g.arc(x,y,p.s,0,6.283);g.fill();
    }
    g.globalCompositeOperation='source-over';
    if(t>1.9)intro.classList.add('show');
    if(t>3.6)end();else requestAnimationFrame(frame);
  })(t0);
})();

/* ===== home ===== */
$('#hello').textContent=ME.name;
const dots=$('#dots');
for(let i=0;i<BONUS.need;i++){const d=document.createElement('div');d.className='dot'+(i<BONUS.count?' on':'');dots.appendChild(d)}
dots.insertAdjacentHTML('beforeend','<div class="dot gift">300</div>');
$('#bnote').textContent=BONUS.active
 ?`Пришли ${BONUS.count} из ${BONUS.need}. Ещё ${BONUS.need-BONUS.count} визит — и вход 300 сом бесплатно.`
 :'Бонус пока не активирован. Попросите администратора включить его.';
const row=v=>`<div class="visit"><div><b>Браслет №${v.bracelet}</b><small>${v.date} · ${v.items}</small></div><div class="sum">${money(v.sum)}</div></div>`;
$('#last').innerHTML=VISITS.slice(0,2).map(row).join('');
$('#all').innerHTML=VISITS.map(row).join('');
$('#tot').textContent=money(VISITS.reduce((s,v)=>s+v.sum,0));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#home').hidden=b.dataset.t!=='home';$('#visits').hidden=b.dataset.t!=='visits';scrollTo(0,0)});

/* ===== QR (динамический, 60 с) ===== */
let qrTimer=null,qrObj=null;
async function newToken(){
  /* TODO: GET {apiUrl}/api/go/qr -> {token}. Сейчас — демо-токен */
  return 'PARORDO:'+ME.id+':'+Math.random().toString(36).slice(2,10)+':'+Date.now();
}
async function drawQr(){
  const box=$('#qr'),tok=await newToken();box.innerHTML='';
  if(window.QRCode){qrObj=new QRCode(box,{text:tok,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}
  else box.textContent='Нет интернета: QR недоступен';
  const bar=$('#bar');bar.style.transition='none';bar.style.transform='scaleX(1)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition='transform 60s linear';bar.style.transform='scaleX(0)'}));
}
function openQr(){$('#modal').classList.add('open');drawQr();qrTimer=setInterval(drawQr,60000)}
function closeQr(){$('#modal').classList.remove('open');clearInterval(qrTimer)}
$('#qrbtn').onclick=openQr;$('#close').onclick=closeQr;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeQr()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeQr()});

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>

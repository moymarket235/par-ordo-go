plugins {
    id 'com.android.application'
}

android {
    namespace 'kg.parordo.go'
    compileSdk 35

    defaultConfig {
        applicationId 'kg.parordo.go'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // The first distributable build is signed with the CI debug key.
            // Replace this with a private release keystore before public store distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

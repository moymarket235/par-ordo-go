name: Build PAR ORDO GO APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK was not found on this GitHub runner."
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/par-ordo-go.apk
          test -s dist/par-ordo-go.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: par-ordo-go-apk
          path: dist/par-ordo-go.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: par-ordo-go-apk-${{ github.run_number }}
          name: PAR ORDO GO APK - Build ${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          body: |
            PAR ORDO GO Android WebView APK.

            This initial CI build uses the debug signing key. For production updates and Google Play distribution, configure a private release keystore in GitHub Actions Secrets.
          files: dist/par-ordo-go.apk
          
